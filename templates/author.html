{% extends "base.html" %}
{% block title %}@{{ author.username }} — BlogSpace{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold">Посты @{{ author.username }}</h1>
<div class="mt-6 grid gap-5 md:grid-cols-2">{% for p in posts %}
    <article class="rounded-3xl bg-white p-6">
        <h2 class="text-2xl font-bold">
            <a href="{{ url_for('posts.post',pid=p.id) }}">{{ p.title }}</a>
        </h2>
        <p class="mt-3">{{ p.body|preview }}</p>
        <div class="mt-4 text-sm">♥ {{ p.like_count }} · 💬 {{ p.comment_count }}</div>
    </article>
    {% endfor %}
</div>
{% endblock %}
