{% extends "base.html" %}
{% block title%}{{ code }} — BlogSpace{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl rounded-3xl bg-white p-10 text-center">
    <div class="text-6xl font-bold">{{ code }}</div>
    <h1 class="mt-3 text-2xl font-bold">{{ title }}</h1>
    <p class="mt-2">{{ message }}</p>
    <a href="{{ url_for('posts.index') }}" class="mt-6 inline-block rounded-xl bg-black px-5 py-3 text-white">На главную</a>
</div>
{% endblock %}
