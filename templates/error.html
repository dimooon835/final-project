{% extends "base.html" %}
{% block title %}Ошибка {{ code }} — BlogSpace{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl py-16 text-center">
    <h1 class="text-5xl font-semibold">{{ code }}</h1>
    <p class="mt-4 text-stone-600">{{ message }}</p>
    <a href="{{ url_for('posts.index') }}" class="mt-7 inline-block rounded-xl bg-stone-900 px-5 py-3 font-medium text-white">На главную</a>
</section>
{% endblock %}
